[project]
name = "tranibor-certificates-ct"
version = "0.1.0"
description = "The `certificates/certificates@1` profile served for Certificate Transparency, governed by Tranibor."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "GRAAL.SYSTEMS SAS" }]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[project.scripts]
certificates-ct = "tranibor_certificates_ct.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.14",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
  "jinja2>=3.1",
  "respx>=0.22",
  "tranibor-certificates-conformance",
]

[tool.uv.sources]
# The profile's conformance suite, from this repository (editable). Dev only: the image installs no dev group.
tranibor-certificates-conformance = { path = "../../certificates/conformance", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_certificates_ct"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
