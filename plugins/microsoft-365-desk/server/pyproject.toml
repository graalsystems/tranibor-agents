[project]
name = "tranibor-m365-desk"
version = "0.1.3"
description = "MCP server: a Microsoft 365 shared mailbox and a Teams channel as a Tranibor tracker."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "GRAAL.SYSTEMS SAS" }]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[project.scripts]
tranibor-m365-desk = "tranibor_m365_desk.app:main"
# The former command, for the window of the core's ADR 0226 (a script or a runbook may still run it).
choregos-m365-desk = "tranibor_m365_desk.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.14",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `choregos_m365_desk` is the former import name, an alias of the package (src/choregos_m365_desk).
packages = ["src/tranibor_m365_desk", "src/choregos_m365_desk"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
