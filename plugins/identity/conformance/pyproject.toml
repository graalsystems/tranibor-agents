[project]
name = "tranibor-identity-conformance"
version = "0.1.0"
description = "Conformance suite of the Tranibor `identity/identity@1` profile: run it against any server that implements it."
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "GRAAL.SYSTEMS SAS" }]
dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "jinja2>=3.1",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.14", "types-pyyaml>=6.0", "types-jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_identity_conformance"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
