# SPDX-License-Identifier: Apache-2.0
# An access review under review: request → report (agent) → review (directory owner) → done.
#
# - The steward finds the instance that serves the directory, reads it and writes a report. Any write it
#   calls (disable, enable, sign out, setup mail, membership) is a governed action waiting in Approvals:
#   nothing reaches the directory from the run itself. `disable_user`, `enable_user`, `logout_user` and
#   `send_setup_email` always need a person; the memberships follow the project's policy.
# - The owner reads the report and decides each proposed action in Approvals, then confirms below. Rejecting
#   sends the request back to the queue.
# - The workflow cannot name a connector, since the provider is whichever instance the organisation connected.
# - A failed run goes back to the queue untouched: the steward writes nothing on failure.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: identity-review
  version: 1
  description: An access review of a directory, written by an agent, then reviewed and applied by the directory owner through approvals.
  inputs:
    type: object
    required: [directory]
    properties:
      directory: { type: string, title: Directory, minLength: 1, maxLength: 200, description: The directory to review (the name the identity server lists, e.g. a realm or a tenant) }
      question: { type: string, title: What to look at, maxLength: 2000, description: "Optional: dormant accounts, accounts without a second factor, administrators, a group against a list" }
initial: queue
actors:
  steward: { type: agent, role: review, agent: identity-steward, model: "profile:standard", max_turns: 30, max_minutes: 15 }
  directory_owner: { type: human, group: directory-owners, sla_hours: 24 }
states:
  queue: { display: Requested, kind: wait }
  awaiting_review: { display: Report to review, kind: wait }
  done: { display: Done, terminal: true }
  needs_human: { display: Needs a human, kind: wait }
  abandoned: { display: Dropped, terminal: true, outcome: cancelled }
transitions:
  - id: t-review-report
    from: queue
    to: awaiting_review
    by: steward
    outputs: [identity_steward_markdown]
    output_types: { identity_steward_markdown: markdown }
    gates: [outputs_present]
    on_fail: { to: queue, max_attempts: 2, escalate_to: needs_human }

  - id: t-decide
    from: awaiting_review
    to: done
    by: directory_owner
    task:
      title: Review the report and decide the proposed changes
      instructions: >-
        Read the report: which instance serves the directory, what it found (each with its evidence), what it
        could not know, and the changes it proposes with what undoes them. Treat each finding as a candidate:
        ask the person's manager before disabling an account. Decide each proposed action in Approvals.
        Confirm below when you are done. Reject to send the request back to the queue.
      form:
        type: object
        required: [directory]
        properties:
          directory: { type: string, title: Directory reviewed, description: The directory you reviewed and decided }
      attest: I reviewed the report and decided its actions
    on_reject: queue

  - id: t-abandon
    from: needs_human
    to: abandoned
    by: directory_owner
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
