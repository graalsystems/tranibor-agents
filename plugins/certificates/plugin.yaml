# SPDX-License-Identifier: Apache-2.0
# The `certificates` plugin (ADR 0224): the certificates profile (what any certificate source's server must
# serve), the provider-neutral agent `cert-watch`, its skill, the `cert-review` template and the evals. It
# brings no server: a provider plugin (`certificates-probe`, `certificates-cert-manager`, `certificates-ct`, ...) brings one that `implements: [certificates/certificates@1]`.
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: certificates
  version: 0.1.0
  publisher: GRAAL.SYSTEMS SAS
  license: Apache-2.0
  description: >-
    Watch the TLS certificates an organisation depends on: an agent reads every certificate source the
    organisation installed (live endpoints, a certificate manager, a transparency log), finds what
    expires or is broken soon with the evidence, and proposes the renewal through whatever manages the
    certificate; a person reads the report. Read-only in this version: no server of the profile writes. The
    agent names no provider.
  homepage: https://github.com/graalsystems/tranibor-agents
  # `contents.profiles` and `mcp_servers[].profile` arrive with the core stories S86-01/S86-02. The first core
  # release that carries them is not known yet: this floor is a placeholder to set to that release.
  core: ">=0.30.0,<1.0.0"
requires:
  plugins: []
  connectors: {}
contents:
  profiles: [profiles/certificates.yaml]
  agents: [agents/cert-watch.yaml]
  skills: [skills/certificate-renewal-triage]
  templates: [templates/cert-review]
  evals: [evals/cert-watch.yaml]
