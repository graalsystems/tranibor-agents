# SPDX-License-Identifier: Apache-2.0
# A DNS change under review: request → plan (agent) → review (zone owner) → apply → refresh → done.
#
# - The steward reads the zone and writes a plan. Any write it calls (create, update, delete) is a governed
#   action waiting in Approvals: nothing reaches OVHcloud from the run itself, and nothing is public yet,
#   because OVHcloud holds a change in the zone until it is refreshed.
# - The zone owner reads the plan, decides the proposed actions in Approvals (that is the apply: each approved
#   action is written to the zone), and confirms the zone to publish. Rejecting sends the request back to the
#   queue with nothing published.
# - The refresh is a second, separate governed action (`refresh_zone` always needs a person): the whole
#   public sees the change only then.
# - A failed plan goes back to the queue untouched: the steward writes nothing on failure.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: dns-change
  version: 1
  description: A DNS change planned by an agent, reviewed and applied by the zone owner, then published by a second approval.
  # The work item's fields: the zone is the request's (an allow-listed zone of the connector), the request
  # is its title and body.
  inputs:
    type: object
    required: [zone]
    properties:
      zone: { type: string, title: Zone, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$", description: The zone to change, e.g. example.com }
initial: queue
actors:
  steward: { type: agent, role: plan, agent: dns-steward, model: "profile:standard", max_turns: 30, max_minutes: 15 }
  zone_owner: { type: human, group: zone-owners, sla_hours: 8 }
  platform: { type: system }
states:
  queue: { display: Requested, kind: wait }
  awaiting_review: { display: Plan to review, kind: wait }
  applied: { display: Changes applied, kind: work }
  done: { display: Published, terminal: true }
  needs_human: { display: Needs a human, kind: wait }
  abandoned: { display: Dropped, terminal: true, outcome: cancelled }
transitions:
  - id: t-plan
    from: queue
    to: awaiting_review
    by: steward
    outputs: [dns_steward_markdown]
    output_types: { dns_steward_markdown: markdown }
    gates: [outputs_present]
    on_fail: { to: queue, max_attempts: 2, escalate_to: needs_human }

  - id: t-review
    from: awaiting_review
    to: applied
    by: zone_owner
    task:
      title: Review the plan, apply the changes
      instructions: >-
        Read the plan: the records it changes, their previous values (the rollback), the TTL advice and its
        warnings. Decide each proposed action in Approvals; an approved action is written to the zone and
        waits there, unpublished. Confirm the zone below when the changes you wanted are applied. Reject to
        send the request back to the queue with nothing published.
      form:
        type: object
        required: [zone]
        properties:
          zone: { type: string, title: Zone to publish, description: The zone whose pending changes the next step publishes }
      attest: I reviewed the plan and decided its actions
    on_reject: queue

  - id: t-refresh
    from: applied
    to: done
    by: platform
    action:
      kind: ovh_dns.refresh_zone
      title: "Publish the changes to {{ fields.zone }}"
      justification: the zone owner applied the reviewed plan
      params:
        zone: "{{ fields.zone }}"
      effects:
        - effect: connector.call
          with:
            connector: ovh-dns
            operation: refresh_zone
            arguments: { zone: "{{ params.zone }}" }
    on_fail: { to: applied, max_attempts: 2, escalate_to: needs_human }

  - id: t-abandon
    from: needs_human
    to: abandoned
    by: zone_owner
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
