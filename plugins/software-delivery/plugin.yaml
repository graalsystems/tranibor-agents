# SPDX-License-Identifier: Apache-2.0
# The software delivery agents of the core's built-in catalogue (ADR 0040), as one plugin (A-03): every
# agent the core's delivery templates name, from triage to the production check. Each agent file is the
# core's entry, unchanged.
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: software-delivery
  version: 1.4.0
  publisher: GRAAL.SYSTEMS SAS
  license: Apache-2.0
  description: >-
    The agents of a governed software delivery, from the core's built-in catalogue: triage,
    research, specification, plan, architecture decision records (MADR 4), implementation, CI
    fixes, code and security review, tests, QA with mutation testing, supply-chain and compliance
    review, UX and accessibility review, documentation, release notes, release readiness and the
    production go or no-go.
  homepage: https://github.com/graalsystems/tranibor-agents
  # 0.20.6, the latest core release, was tagged before the plugin installer (S43); 0.21.0 is the first
  # release that installs plugins. These agents need only the catalogue entry shape (ADR 0040) and the
  # work-item context the core prepends to their instructions, both stable across 0.x.
  # 1.1.0: every agent declares its five components (ADR 0127, S60-04): `model`, `tools.catalogue|extensions|web`,
  # `memories`. An older core refuses the spec fields it does not know, so it keeps the previous version; the
  # first core release with them (S60-01) is 0.25.1. 1.1.1: `researcher` declares `web: [fetch, search]`,
  # which its eval E5 reads and 1.1.0 had closed.
  # 1.2.0: the agents carry what their instructions use. Ten generic skills (`test-first`, `conventional-commits`,
  # `code-review`, `security-review`, `release-notes`, `ci-failure-triage`, `work-item-sizing`, `acceptance-criteria`,
  # `safe-rollout`, `primary-sources`) join `madr-4`; `architect` declares `web: [fetch]` for primary sources; the agents
  # that apply an organisation's conventions say to read the knowledge bases under `.choregos/knowledge/`.
  # Needs the skills the 1.1.x agents did not name, so the agents it changes are offered as a new version.
  # 1.3.0: names the extension it needs (ADR 0181, core 0.28.1): `software-delivery`, the `choregos.plugins`
  # entry point of the core's `tranibor-software-delivery` wheel, which carries the release train, the
  # SCM/CI/CD connectors and the delivery workflows since round D. A deployment without it refuses the plugin,
  # naming it; an older core refuses the unknown field, so it keeps 1.2.2.
  # 1.4.0: the developer, qa and tester agents and the test-first skill name the evidence the core 0.29 reads,
  # the named facts of `evidence.facts` (ADR 0181, whose windows closed on 2026-11-23: the evidence fields
  # left the stage result). An older core keeps 1.3.1.
  core: ">=0.29.0,<1.0.0"
requires:
  plugins: []
  connectors: {}
  extensions: [software-delivery]
contents:
  agents:
    - agents/architect.yaml
    - agents/ci-fixer.yaml
    - agents/compliance.yaml
    - agents/developer.yaml
    - agents/devops.yaml
    - agents/docs-writer.yaml
    - agents/planner.yaml
    - agents/prod-verifier.yaml
    - agents/qa.yaml
    - agents/release-notes-writer.yaml
    - agents/researcher.yaml
    - agents/review-responder.yaml
    - agents/reviewer.yaml
    - agents/secops.yaml
    - agents/security-reviewer.yaml
    - agents/spec-writer.yaml
    - agents/tester.yaml
    - agents/triager.yaml
    - agents/ux-designer.yaml
  skills:
    - skills/acceptance-criteria
    - skills/ci-failure-triage
    - skills/code-review
    - skills/conventional-commits
    - skills/madr-4
    - skills/primary-sources
    - skills/release-notes
    - skills/safe-rollout
    - skills/security-review
    - skills/test-first
    - skills/work-item-sizing
  evals:
    - evals/architect-accept.yaml
    - evals/architect.yaml
    - evals/ci-fixer.yaml
    - evals/compliance.yaml
    - evals/developer.yaml
    - evals/devops-verify.yaml
    - evals/devops.yaml
    - evals/docs-writer.yaml
    - evals/planner.yaml
    - evals/prod-verifier-with-indicators.yaml
    - evals/prod-verifier.yaml
    - evals/qa.yaml
    - evals/release-notes-writer.yaml
    - evals/researcher.yaml
    - evals/review-responder.yaml
    - evals/reviewer.yaml
    - evals/secops.yaml
    - evals/security-reviewer.yaml
    - evals/spec-writer.yaml
    - evals/tester.yaml
    - evals/triager.yaml
    - evals/ux-designer.yaml
