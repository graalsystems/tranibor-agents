# SPDX-License-Identifier: Apache-2.0
# One person joining, changing role or leaving, across the systems the organisation connects. The request
# names the person, the date, the role, the manager and an APPROVER; an agent builds the plan; the manager
# and IT approve the plan; every write is then its own governed action with its own approval; a read-back
# checks the result; a person closes what only a person can do.
#
#   received ─ agent: plan ─▶ planned ─ manager ─▶ manager_ok ─ IT ─▶ approved
#   approved ─ one child per write, in this order (an empty list opens none) ─▶
#     accounts (create) → [agent: resolve user ids] → removals → additions → invites → disables → logouts
#   applied ─ agent: read-back ─▶ checked ─ IT closes the manual tasks ─▶ done
#
# - The agent READS (keycloak) and writes nothing. It refuses, with no plan, a request that names no
#   approver, whose approver is the person themselves, or that it cannot resolve; a refusal goes to a person.
# - The target of every write is the request's own `username` (`fields.username`), never the agent's reading
#   of it: a plan cannot aim a write at another account. Only groups, reasons and approvers come from the plan.
# - Removals come before additions (a mover never holds both sets), disabling before ending sessions.
# - A child refused or abandoned does not stop the others; the read-back reports what is not as planned and
#   the work item then goes to a person, never to `done`. Nothing is deleted anywhere.
# - Dates: every write is applied no earlier than `effective_date` (the start date of a joiner, the date of
#   the move, the last day of a leaver), whenever it was approved.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: joiner-leaver
  version: 1
  description: A joiner, a mover or a leaver — a plan approved by the manager and IT, one governed action per write, a read-back, and the manual tasks closed by a person.
  inputs:
    type: object
    required: [kind, full_name, username, effective_date, approver]
    properties:
      kind: { type: string, title: Joiner, mover or leaver, enum: [joiner, mover, leaver] }
      full_name: { type: string, title: Full name, minLength: 1, maxLength: 200 }
      username: { type: string, title: Account (username), minLength: 1, maxLength: 120, pattern: "^[A-Za-z0-9._@+-]+$" }
      email: { type: string, title: E-mail, maxLength: 200 }
      effective_date: { type: string, format: date, title: Start date, move date or last day }
      role: { type: string, title: Role (new role for a mover), maxLength: 120 }
      previous_role: { type: string, title: Previous role (mover), maxLength: 120 }
      team: { type: string, title: Team, maxLength: 120 }
      manager: { type: string, title: Manager (username or e-mail), maxLength: 200 }
      approver: { type: string, title: Approver who authorised the request (name and e-mail), maxLength: 200 }
      requester: { type: string, title: Requested by, maxLength: 200 }
      notes: { type: string, title: Anything else, maxLength: 2000 }
      outcome: { type: string, title: What was done by hand and what was not (filled when closing), maxLength: 2000 }
initial: received
actors:
  agent: { type: agent, role: people_ops, agent: people-ops-it, max_turns: 25, max_minutes: 10 }
  manager: { type: human, group: jml-managers, sla_hours: 24 }
  it: { type: human, group: it-desk, sla_hours: 24 }
  platform: { type: system }
states:
  received: { display: Request received, kind: wait }
  planned: { display: Plan to approve (manager), kind: wait }
  manager_ok: { display: Plan to approve (IT), kind: wait }
  approved: { display: Plan approved, kind: wait }
  accounts_done: { display: Account written, kind: wait }
  resolved: { display: Account ids resolved, kind: wait }
  removals_done: { display: Group removals decided, kind: wait }
  additions_done: { display: Group additions decided, kind: wait }
  invites_done: { display: Invitation decided, kind: wait }
  disables_done: { display: Disabling decided, kind: wait }
  applied: { display: Writes decided, kind: wait }
  checked: { display: Read-back done, kind: wait }
  to_review: { display: For a person, kind: wait }
  needs_human: { display: Needs a human, kind: wait }
  done: { display: Done, terminal: true }
  handled: { display: Handled by a person, terminal: true }
  declined: { display: Declined, terminal: true }
  abandoned: { display: Abandoned, terminal: true }
transitions:
  # The plan. `decision: refused` carries no plan to approve (the summary says why); a plan with
  # `decision: plan` always carries every list, empty when there is nothing of that kind.
  - id: t-plan
    from: received
    to: planned
    by: agent
    outputs: [decision, summary, changes]
    gates:
      - outputs_present
      - name: output_schema
        params:
          schemas:
            decision: { type: string, enum: [plan, refused] }
            summary: { type: string, minLength: 1, maxLength: 8000 }
            changes:
              type: object
              required: [accounts, group_removals, group_additions, invites, disables, logouts, manual_tasks]
              additionalProperties: false
              properties:
                accounts:
                  type: array
                  maxItems: 1
                  items:
                    type: object
                    required: [email, first_name, last_name, approver_group, reason]
                    additionalProperties: false
                    properties:
                      email: { type: string, minLength: 3, maxLength: 200, pattern: "^[^@\\s]+@[^@\\s]+$" }
                      first_name: { type: string, minLength: 1, maxLength: 100 }
                      last_name: { type: string, minLength: 1, maxLength: 100 }
                      approver_group: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,60}$" }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
                group_removals: { $ref: "#/$defs/groups" }
                group_additions: { $ref: "#/$defs/groups" }
                invites: { $ref: "#/$defs/plain" }
                disables: { $ref: "#/$defs/plain" }
                logouts: { $ref: "#/$defs/plain" }
                manual_tasks:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 300 }
              $defs:
                groups:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [group_id, group_path, sensitive, approver_group, reason]
                    additionalProperties: false
                    properties:
                      group_id: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }
                      group_path: { type: string, minLength: 1, maxLength: 200 }
                      sensitive: { type: boolean }
                      approver_group: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,60}$" }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
                plain:
                  type: array
                  maxItems: 1
                  items:
                    type: object
                    required: [approver_group, reason]
                    additionalProperties: false
                    properties:
                      approver_group: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,60}$" }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
    on_fail: { to: received, max_attempts: 2, escalate_to: to_review }

  # A request the agent refused (no approver, nothing resolved, the person unknown...) is for a person.
  - id: t-refused
    from: planned
    to: to_review
    by: platform
    when: { decision: refused }

  # Four eyes on the plan: the person's manager, then IT. Rejected by either, it ends declined.
  - id: t-manager
    from: planned
    to: manager_ok
    by: manager
    timeout_hours: 336
    on_reject: declined

  - id: t-it
    from: manager_ok
    to: approved
    by: it
    timeout_hours: 336
    on_reject: declined

  # The writes, one child per element, in the order the header gives. The target is `fields.username`.
  - id: t-accounts
    from: approved
    to: accounts_done
    by: platform
    spawn:
      workflow: jml-create-account
      for_each: outputs.changes.accounts
      title: "Create the account {{ fields.username }}"
      fields:
        username: "{{ fields.username }}"
        effective_date: "{{ fields.effective_date }}"
        approver: "{{ fields.approver }}"
        requester: "{{ fields.requester | default('', true) }}"
        manager: "{{ fields.manager | default('', true) }}"
        request: "{{ parent.key }}"
        approver_group: "{{ item.approver_group }}"
        reason: "{{ item.reason }}"
        email: "{{ item.email }}"
        first_name: "{{ item.first_name }}"
        last_name: "{{ item.last_name }}"
      max_children: 1
      succeeded: [applied]
    on_fail: { to: approved, max_attempts: 1, escalate_to: to_review }

  # The account now exists (a joiner): the agent reads Keycloak again and gives the user id of `username`.
  - id: t-resolve
    from: accounts_done
    to: resolved
    by: agent
    outputs: [resolved]
    gates:
      - outputs_present
      - name: output_schema
        params:
          schemas:
            resolved:
              type: object
              minProperties: 1
              maxProperties: 1
              additionalProperties: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }
    on_fail: { to: accounts_done, max_attempts: 2, escalate_to: to_review }

  - id: t-removals
    from: resolved
    to: removals_done
    by: platform
    spawn:
      workflow: jml-group-remove
      for_each: outputs.changes.group_removals
      title: "Remove {{ fields.username }} from {{ item.group_path }}"
      fields: &grouped
        username: "{{ fields.username }}"
        user_id: "{{ outputs.resolved[fields.username] | string }}"
        effective_date: "{{ fields.effective_date }}"
        approver: "{{ fields.approver }}"
        requester: "{{ fields.requester | default('', true) }}"
        manager: "{{ fields.manager | default('', true) }}"
        request: "{{ parent.key }}"
        approver_group: "{{ item.approver_group }}"
        reason: "{{ item.reason }}"
        group_id: "{{ item.group_id }}"
        group_path: "{{ item.group_path }}"
        sensitive: "{{ item.sensitive }}"
      max_children: 30
      succeeded: [applied]
    on_fail: { to: resolved, max_attempts: 1, escalate_to: to_review }

  - id: t-additions
    from: removals_done
    to: additions_done
    by: platform
    spawn:
      workflow: jml-group-add
      for_each: outputs.changes.group_additions
      title: "Add {{ fields.username }} to {{ item.group_path }}"
      fields: *grouped
      max_children: 30
      succeeded: [applied]
    on_fail: { to: removals_done, max_attempts: 1, escalate_to: to_review }

  - id: t-invites
    from: additions_done
    to: invites_done
    by: platform
    spawn:
      workflow: jml-invite
      for_each: outputs.changes.invites
      title: "Invite {{ fields.username }} to complete the account"
      fields: &plain
        username: "{{ fields.username }}"
        user_id: "{{ outputs.resolved[fields.username] | string }}"
        effective_date: "{{ fields.effective_date }}"
        approver: "{{ fields.approver }}"
        requester: "{{ fields.requester | default('', true) }}"
        manager: "{{ fields.manager | default('', true) }}"
        request: "{{ parent.key }}"
        approver_group: "{{ item.approver_group }}"
        reason: "{{ item.reason }}"
      max_children: 1
      succeeded: [applied]
    on_fail: { to: additions_done, max_attempts: 1, escalate_to: to_review }

  - id: t-disables
    from: invites_done
    to: disables_done
    by: platform
    spawn:
      workflow: jml-disable
      for_each: outputs.changes.disables
      title: "Disable the account {{ fields.username }}"
      fields: *plain
      max_children: 1
      succeeded: [applied]
    on_fail: { to: invites_done, max_attempts: 1, escalate_to: to_review }

  - id: t-logouts
    from: disables_done
    to: applied
    by: platform
    spawn:
      workflow: jml-logout
      for_each: outputs.changes.logouts
      title: "End the sessions of {{ fields.username }}"
      fields: *plain
      max_children: 1
      succeeded: [applied]
    on_fail: { to: disables_done, max_attempts: 1, escalate_to: to_review }

  # The read-back: the agent reads Keycloak again and says whether the person is as the plan said.
  - id: t-verify
    from: applied
    to: checked
    by: agent
    outputs: [verified, verification]
    gates:
      - outputs_present
      - name: output_schema
        params:
          schemas:
            verified: { type: boolean }
            verification: { type: string, minLength: 1, maxLength: 8000 }
    on_fail: { to: applied, max_attempts: 2, escalate_to: to_review }

  # Only a read-back that confirms the plan closes it; anything else goes to a person.
  - id: t-close
    from: checked
    to: done
    by: it
    when: { verified: true }
    task:
      title: Close the manual tasks
      instructions: >-
        The agent's plan lists what only a person can do (hardware return, shared mailbox, ownership
        transfer, a system that is not connected yet). Do each one, or record why it is not done.
      form:
        type: object
        required: [outcome]
        properties:
          outcome: { type: string, title: What was done by hand and what was not, minLength: 1, maxLength: 2000 }
      attest: I did, or recorded why I did not do, each manual task of the plan
    on_reject: to_review

  - id: t-not-verified
    from: checked
    to: to_review
    by: platform

  - id: t-handle
    from: to_review
    to: handled
    by: it
    timeout_hours: 720
    on_reject: declined

  - id: t-abandon
    from: needs_human
    to: abandoned
    by: it
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
