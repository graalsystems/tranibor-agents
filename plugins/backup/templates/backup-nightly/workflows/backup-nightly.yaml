# SPDX-License-Identifier: Apache-2.0
# Nightly backup verification: queue -> verify (agent) -> done when Green, review (platform owner) when Red.
#
# - The verifier reads, proposes a restore of one source into an isolated target and cleans it up. The writes
#   are governed actions: `run_restore_test` is `human_approval: true` in the profile and always waits for a
#   person (README.md); a restore that never ran makes its schedule Red, never Green.
# - The workflow cannot name a connector: the backup system is whichever instance of `backup/backup@1` the
#   organisation connected, and the agent asks each one.
# - The verdict is an output the workflow branches on: `Red` goes to the platform owner, anything else
#   (`Green`) is done. A missing verdict matches nothing and falls to the default transition, so the
#   `outputs_present` gate keeps a run without one from passing.
# - The review has nothing to apply: the proposed fix is text, and a person carries it out.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: backup-nightly
  version: 1
  description: Backups verified by restoring one source into an isolated target, reported Green or Red, a Red reviewed by the platform owner.
  # The work item's fields, from the project's `schedules` entry (`fields:`) and the review form.
  inputs:
    type: object
    properties:
      schedule: { type: string, title: Schedule to verify (empty means every schedule), maxLength: 253 }
      source: { type: string, title: Source to restore (default the first of each backup), maxLength: 253 }
      outcome: { type: string, title: Outcome, enum: [fix_planned, risk_accepted, false_alarm] }
      owner_note: { type: string, title: Owner's note, maxLength: 4000 }
initial: queue
actors:
  verifier: { type: agent, role: verify, agent: backup-verifier, model: "profile:standard", max_turns: 60, max_minutes: 30 }
  platform_owner: { type: human, group: platform-owner, sla_hours: 24 }
states:
  queue: { display: Waiting for tonight's run, kind: wait }
  awaiting_owner: { display: Red - to review, kind: wait }
  done: { display: Verified, terminal: true }
  needs_human: { display: Needs a human, kind: wait }
  abandoned: { display: Left to the platform owner, terminal: true }
transitions:
  # Red first: the first transition whose `when` holds is taken, the one without `when` is the default.
  - id: t-red
    from: queue
    to: awaiting_owner
    by: verifier
    when: { backup_verdict: Red }
    outputs: [backup_verdict, backup_report_markdown]
    output_types: { backup_verdict: text, backup_report_markdown: markdown }
    gates: [outputs_present]
    on_fail: { to: queue, max_attempts: 2, escalate_to: needs_human }

  - id: t-green
    from: queue
    to: done
    by: verifier
    outputs: [backup_verdict, backup_report_markdown]
    output_types: { backup_verdict: text, backup_report_markdown: markdown }
    gates: [outputs_present]
    on_fail: { to: queue, max_attempts: 2, escalate_to: needs_human }

  - id: t-review
    from: awaiting_owner
    to: done
    by: platform_owner
    task:
      title: Settle the Red backup verdict
      instructions: >-
        Read the report: each Red schedule has its evidence and a proposed fix, written as text. Nothing was
        changed on the backup system. Carry out the fix you agree with (or decide not to), then say which it was.
        Test targets the verifier could not delete are listed under Cleanup.
      form:
        type: object
        required: [outcome, owner_note]
        properties:
          outcome: { type: string, title: Outcome, enum: [fix_planned, risk_accepted, false_alarm] }
          owner_note: { type: string, title: Owner's note, minLength: 1, maxLength: 4000 }
      attest: I read the evidence and the proposed fix and decided what to do

  - id: t-abandon
    from: needs_human
    to: abandoned
    by: platform_owner
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
