# SPDX-License-Identifier: Apache-2.0
# The procurement plugin (core ADR 0202): the two agents of the comparison of supplier offers. One copies
# what the offers say into a structure, the other writes the memo from numbers a deterministic step measured.
# The template `procurement-sourcing` runs them; the job image that extracts and computes is the core's.
# 0.3.0 splits the plugin in two (core finding graalsystems/tranibor#2134): everything that needs the MCP server
# `purchasing` (the server, the assistant, the operations template, the four agents and the connector procedure)
# moved to the plugin `procurement-operations`. This plugin brings no server, so a deployment that runs no plugin
# server (the local `docker compose` install) can install it and offer the comparison of offers.
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: procurement
  version: 0.3.0
  publisher: GRAAL.SYSTEMS SAS
  license: Apache-2.0
  description: >-
    Compare supplier offers without trusting a model with arithmetic: an agent copies what each offer says
    into a structure, a deterministic step computes, and a second agent writes a memo that ranks by the
    measured total, lists what differs and recommends nobody.
  homepage: https://github.com/graalsystems/tranibor-agents
  # PROVISIONAL floor: 0.28.0 is the first core release expected to carry the reserved input `attachments`
  # (core ADR 0201). Correct it to that release's actual version when this plugin is published.
  core: ">=0.28.1,<1.0.0"
requires:
  plugins: []
  connectors: {}
contents:
  agents: [agents/offer-reader.yaml, agents/sourcing-analyst.yaml]
  skills: [skills/reading-supplier-offers, skills/writing-comparison-memos]
  templates: [templates/procurement-sourcing]
  evals: [evals/offer-reader.yaml, evals/sourcing-analyst.yaml]
