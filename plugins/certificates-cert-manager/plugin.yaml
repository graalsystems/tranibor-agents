# SPDX-License-Identifier: Apache-2.0
# The cert-manager server of the `certificates` profile (ADR 0224): it serves certificates/certificates@1 for
# the Certificates cert-manager manages in a Kubernetes cluster, and the procedure an administrator follows to
# give it a read-only service account. The agent, skill, template and evals live in the `certificates` plugin,
# which this one requires.
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: certificates-cert-manager
  version: 0.1.0
  publisher: GRAAL.SYSTEMS SAS
  license: Apache-2.0
  description: >-
    Serve the certificates cert-manager manages to the `certificates` plugin's agent: their dates, issuer and
    Ready state, the renewal state (ok, due, pending, failing), and what a stuck renewal is waiting on (the
    CertificateRequest, the ACME Order and Challenge, the issuer). Read-only, through a service account that
    can read cert-manager resources and nothing else, not even a Secret.
  homepage: https://github.com/graalsystems/tranibor-agents
  # Profiles (`implements`) arrive with the core stories S86-01/S86-02; the first core release that carries
  # them is not known yet, so this floor is a placeholder to be set to that release. The `certificates` plugin
  # says the same.
  core: ">=0.30.0,<1.0.0"
requires:
  plugins: [certificates]
  connectors: {}
contents:
  procedures: ["procedures/*.md"]
  servers: [servers/certificates-cert-manager.yaml]
