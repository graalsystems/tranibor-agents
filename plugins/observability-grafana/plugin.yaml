# SPDX-License-Identifier: Apache-2.0
# The Grafana server of the `observability` profile (ADR 0224): it serves observability/observability@1 for
# Grafana (alerting, Prometheus-type and Loki datasources through Grafana's proxy, annotations, silences), and
# the procedure an administrator follows to create its service-account token. The agent, skill, template and
# evals live in the `observability` plugin, which this one requires.
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: observability-grafana
  version: 0.1.0
  publisher: GRAAL.SYSTEMS SAS
  license: Apache-2.0
  description: >-
    Serve a Grafana stack to the `observability` plugin's agent: firing alerts and their rules, silences,
    bounded metric and log queries through an allow-list of datasources, dashboards and annotations, and
    silences and annotations as governed writes. A silence always needs a person and expiring it is its undo.
  homepage: https://github.com/graalsystems/tranibor-agents
  # Profiles (`implements`) arrive with the core stories S86-01/S86-02; the first core release that carries
  # them is not known yet, so this floor is a placeholder to be set to that release. The `observability` plugin says the same.
  core: ">=0.30.0,<1.0.0"
requires:
  plugins: [{name: observability, version: ">=0.1.0,<1.0.0"}]
  connectors: {}
contents:
  procedures: ["procedures/*.md"]
  servers: [servers/observability-grafana.yaml]
